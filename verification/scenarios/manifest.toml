version = 1

[[route]]
id = "index"
path = "/"
description = "Root and index route family that redirects operators into the agents route."

[[route]]
id = "root-shell"
path = "__root__"
description = "Root application shell route that wraps routed workspaces and owns viewport-constrained layout behavior."

[[route]]
id = "agents"
path = "/agents"
description = "Agents route family with selected-agent search-state ownership."

[[route]]
id = "run-detail"
path = "/runs/$runId"
description = "Run-detail route family that owns shared live timeline follow and recovery behavior, including embedded run-detail surfaces."

[[scenario]]
prd = "PRD-0100"
scenario_id = "SCN-0000"
title = "Redirects the root route to the agents hub"
route_id = "index"
state_id = "redirect-to-agents"
fixtures = ["root-index-redirect"]

[[scenario.evidence]]
lane = "vitest"
file = "sigil-web/src/route-contract.test.ts"
match = "redirects the root route into the agents hub"

[[scenario]]
prd = "PRD-0150"
scenario_id = "SCN-0000"
title = "Keeps routed workspaces inside the application shell on supported desktop viewports"
route_id = "root-shell"
state_id = "desktop-viewport-shell"
fixtures = ["desktop-app-shell"]

[[scenario.evidence]]
lane = "vitest"
file = "sigil-web/src/route-contract.test.ts"
match = "keeps routed workspaces inside the application shell on supported desktop viewports"

[[scenario]]
prd = "PRD-0150"
scenario_id = "SCN-0001"
title = "Preserves access below the minimum supported desktop height"
route_id = "root-shell"
state_id = "compact-height-fallback"
fixtures = ["compact-height-app-shell"]

[[scenario.evidence]]
lane = "vitest"
file = "sigil-web/src/route-contract.test.ts"
match = "preserves access below the minimum supported desktop height"

[[scenario]]
prd = "PRD-0200"
scenario_id = "SCN-0000"
title = "Deep-links the selected agent in the agents route"
route_id = "agents"
state_id = "agent-selected"
fixtures = ["selected-agent-route-state"]

[[scenario.evidence]]
lane = "vitest"
file = "sigil-web/src/route-contract.test.ts"
match = "preserves selected-agent search state in the agents route"

[[scenario.evidence]]
lane = "paper"

[[scenario]]
prd = "PRD-0300"
scenario_id = "SCN-0000"
title = "Auto-follows the latest event while a live run detail timeline is pinned to the bottom"
route_id = "run-detail"
state_id = "live-timeline-follow"
fixtures = ["run-detail-live-timeline"]

[[scenario.evidence]]
lane = "vitest"
file = "sigil-web/src/components/agents/run-timeline-tab.test.tsx"
match = "Auto-follows the latest event while a live run detail timeline is pinned to the bottom"

[[scenario.evidence]]
lane = "agent-browser"
file = "sigil-web/testing/agent-browser/scenarios/prd-0300-live-timeline.ts"
match = "Auto-follows the latest event while a live run detail timeline is pinned to the bottom"

[[scenario]]
prd = "PRD-0300"
scenario_id = "SCN-0001"
title = "Shows a centered scroll-to-bottom control and resumes follow when the operator has scrolled away from the latest live event"
