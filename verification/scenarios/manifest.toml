version = 1

[[route]]
id = "index"
path = "/"
description = "Root and index route family that redirects operators into the agents route."

[[route]]
id = "agents"
path = "/agents"
description = "Agents route family with selected-agent search-state ownership."

[[route]]
id = "run-detail"
path = "/runs/$runId"
description = "Reserved run-detail route family awaiting re-specified behavior."

[[scenario]]
prd = "PRD-0100"
