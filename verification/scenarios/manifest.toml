[[scenario.evidence]]
lane = "vitest"
file = "sigil-web/src/components/agents/run-timeline-tab.test.tsx"
match = "Shows a centered scroll-to-bottom control and resumes follow when the operator has scrolled away from the latest live event"

[[scenario.evidence]]
lane = "agent-browser"
