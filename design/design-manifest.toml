version = 1
design_tool = "paper"
artboard_name_pattern = "<prd>--<scenario-id>--<route-id>--<state-id>--<viewport-id>"
required_viewports = ["desktop"]

[[viewport]]
id = "desktop"
width = 1440
height = 1024

[[route]]
id = "connect"
path = "/connect"
description = "Session bootstrap, compatibility, and reconnect workflow."

[[route]]
id = "runs-index"
path = "/runs"
description = "Operator shell and run list workflow."

[[route]]
id = "run-detail"
path = "/runs/$runId"
description = "Run summary, drill-in, live orchestration, and stop workflow."

[[route]]
id = "run-new"
path = "/runs/new"
description = "Inline YAML authoring workflow."

[[scenario]]
prd = "PRD-0100"
scenario_id = "SCN-0000"
title = "Connects to a compatible app-server and enters ready operator state"
route_id = "connect"
state_id = "ready"
fixtures = ["compatible-session"]
required_test_ids = [
  "connection-status",
  "connection-instance-name",
  "connection-protocol-version",
  "runs-nav-link",
]
paper_artboards = { desktop = "PRD-0100--SCN-0000--connect--ready--desktop" }

[[scenario]]
prd = "PRD-0100"
scenario_id = "SCN-0001"
title = "Blocks the workspace with an incompatible-server state when protocol negotiation fails"
route_id = "connect"
state_id = "incompatible"
fixtures = ["incompatible-session"]
required_test_ids = [
  "connection-status",
  "connection-error-code",
  "retry-connection-button",
]
paper_artboards = { desktop = "PRD-0100--SCN-0001--connect--incompatible--desktop" }

[[scenario]]
prd = "PRD-0100"
scenario_id = "SCN-0002"
title = "Marks the session degraded and begins reconnecting after a missed heartbeat"
route_id = "connect"
state_id = "reconnecting"
fixtures = ["degraded-session"]
required_test_ids = [
  "connection-status",
  "reconnect-banner",
  "resume-last-route-button",
]
paper_artboards = { desktop = "PRD-0100--SCN-0002--connect--reconnecting--desktop" }

