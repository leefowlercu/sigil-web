version = 1
design_tool = "paper"
artboard_name_pattern = "<prd>--<scenario-id>--<route-id>--<state-id>--<viewport-id>"
required_viewports = ["desktop"]

[[viewport]]
id = "desktop"
width = 1440
height = 1024

[[route]]
id = "agents-hub"
path = "/agents"
description = "Command, control, and fleet workspace with connection state, agent selection, and new-run dialog flows."

[[route]]
id = "run-detail"
path = "/runs/$runId"
description = "Run summary, drill-in, live orchestration, and stop workflow."

[[scenario]]
prd = "PRD-0100"
scenario_id = "SCN-0000"
title = "Connects to a compatible app-server and enters a ready agents hub state"
route_id = "agents-hub"
state_id = "ready"
fixtures = ["compatible-session-ready"]
required_test_ids = [
  "connection-status",
  "connection-instance-name",
  "connection-protocol-version",
  "agent-fleet-list",
]
paper_artboards = { desktop = "PRD-0100--SCN-0000--agents-hub--ready--desktop" }

[[scenario]]
prd = "PRD-0100"
scenario_id = "SCN-0001"
title = "Blocks the agents hub with an incompatible-server state when protocol negotiation fails"
route_id = "agents-hub"
state_id = "incompatible"
fixtures = ["incompatible-session"]
required_test_ids = [
  "connection-status",
  "connection-error-code",
  "retry-connection-button",
]
paper_artboards = { desktop = "PRD-0100--SCN-0001--agents-hub--incompatible--desktop" }

[[scenario]]
prd = "PRD-0100"
scenario_id = "SCN-0002"
title = "Marks the session degraded and begins reconnecting without discarding current agent selection intent"
route_id = "agents-hub"
state_id = "reconnecting"
